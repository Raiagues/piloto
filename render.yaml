# Render Blueprint: one web service + one Postgres database.
# Secrets marked "sync: false" are asked for on the Render screen; they never live in git.
services:
  - type: web
    name: norte
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: norte-db
          property: connectionString
      - key: NORTE_PROVIDER
        value: official
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false

databases:
  - name: norte-db
    databaseName: norte
    user: norte
    plan: free
    region: virginia
    ipAllowList: []
