# Render Blueprint: one web service + one Postgres database.
# Secrets marked "sync: false" are asked for on the Render screen; they never live in git.
services:
  - type: web
    name: norte
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NORTE_MEETING_BRIDGE_SECRET
        generateValue: true
      - key: NORTE_BOOTSTRAP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: norte-db
          property: connectionString
      # Versão de teste: requisitos, cronograma e documentos em modo de leitura.
      - key: NORTE_DELIVERY_READ_ONLY
        value: "1"
      - key: NORTE_PROVIDER
        value: official
      - key: NORTE_PRIVACY_EMAIL
        value: emillyraianerodrigues@gmail.com
      - key: NORTE_LLM_PROVIDER
        value: openai
      - key: NORTE_MEETING_EDITOR_MODEL
        value: gpt-6-luna
      - key: NORTE_MEETING_EDITOR_INPUT_USD_PER_MILLION
        value: "0.10"
      - key: NORTE_MEETING_EDITOR_OUTPUT_USD_PER_MILLION
        value: "0.50"
      - key: NORTE_MINUTES_MODEL
        value: gpt-6.1-sol
      - key: NORTE_MINUTES_INPUT_USD_PER_MILLION
        value: "2.00"
      - key: NORTE_MINUTES_OUTPUT_USD_PER_MILLION
        value: "10.00"
      - key: NORTE_ENGINEERING_MODEL
        value: gpt-6.1-sol
      - key: MINUTES_DAILY_CALL_LIMIT
        value: "50"
      - key: TYPESAFE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_AGENTS_ENABLED
        value: "true"
      - key: AI_EXTERNAL_REVIEW_ENABLED
        value: "true"
      - key: AI_AUTO_PUBLISH
        value: "true"
      - key: AI_DAILY_BUDGET_USD
        value: "1.00"
      - key: AI_DAILY_CALL_LIMIT
        value: "50"
      - key: AI_RETENTION_DAYS
        value: "90"
      - key: JEV_INPUT_USD_PER_MILLION
        value: "0.042"
      - key: JEV_OUTPUT_USD_PER_MILLION
        value: "0"

databases:
  - name: norte-db
    databaseName: norte
    user: norte
    plan: 0.1c-256mb
    region: virginia
    ipAllowList: []
