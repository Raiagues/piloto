/* Editor livre */
.controls>.add-tools{grid-template-columns:repeat(2,1fr)}
.add-tools button{min-height:34px}
.graph-view-switch{display:flex;background:#eef1f4;border-radius:6px;padding:2px;gap:2px}
.graph-view-switch button{border:0;background:transparent;padding:3px 6px;font-size:10px;color:var(--muted)}
.graph-view-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px #22374a14}
.graph-fluid-control{display:flex;align-items:center;gap:4px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:9px;color:var(--muted);white-space:nowrap}
.graph-fluid-control input{margin:0;accent-color:var(--blue)}
.context-menu{position:fixed;z-index:50;width:180px;background:#fff;border:1px solid #d9e0e6;border-radius:9px;padding:5px;box-shadow:0 10px 35px #24354424}
.context-menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 9px;font-size:11px}
.context-menu button:hover{background:#f1f5f8}
.context-menu .danger{color:#a75243}
.graph-pane{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;overflow:hidden}
.graph-pane.detail-open{grid-template-columns:minmax(0,1fr) 265px}
.graph-stage{position:relative;min-width:0;min-height:0;overflow:hidden}
.graph-stage .graph-wrap{position:absolute;inset:0}
.graph-detail{position:relative;min-width:0;min-height:0;overflow:auto;background:#fbfcfd;border-left:1px solid #e1e6eb;padding:14px 14px 18px;z-index:4}
.graph-detail h3{font-size:13px;margin:1px 22px 2px 0}
.graph-detail .kind{font-size:9px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.graph-detail .value{display:block;font-size:17px;color:var(--blue);margin:5px 0 10px;font-variant-numeric:tabular-nums}
.graph-detail p{font-size:10px;line-height:1.55;color:#5e6d7a;margin:0 0 8px}
.graph-detail .close-detail{position:absolute;right:6px;top:6px;border:0;background:transparent;padding:3px 6px;color:var(--muted)}
.graph-detail-section{border-top:1px solid #e5e9ed;padding-top:10px;margin-top:10px}
.graph-detail-section:first-of-type{border-top:0;padding-top:0}
.graph-detail-label{font-size:9px;letter-spacing:.45px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.latex-box{font-family:"STIX Two Math","Cambria Math","Times New Roman",serif;font-size:12px;line-height:1.55;background:#fff;border:1px solid #e1e6eb;border-radius:7px;padding:8px 9px;color:#344b67;overflow-wrap:anywhere}
.change-box{display:flex;gap:8px;align-items:flex-start;border-radius:7px;background:#eef4fb;padding:8px 9px;color:#3f5f87;font-size:10px;line-height:1.45}
.change-box .change-arrow{font-size:17px;line-height:1;font-weight:650;color:var(--blue)}
.change-box .change-values{font-variant-numeric:tabular-nums}
.impact-chips{display:flex;flex-wrap:wrap;gap:5px}
.impact-chips button{border:1px solid #dde5ec;background:#fff;border-radius:999px;padding:4px 7px;font-size:9px;color:#506273;max-width:100%;white-space:normal;text-align:left}
.impact-chips button:hover{border-color:#9eb6d6;background:#f3f7fc}
.impact-chips .direction{color:var(--blue);font-weight:700;margin-right:3px}
.graph-role-note{font-size:10px;color:#657480;line-height:1.55}
.dep-map .edge{stroke-linecap:round;stroke-linejoin:round;transition:opacity .12s,stroke-width .12s,stroke .12s}
.dep-map .node,.dep-map .force-node{transition:opacity .12s}
.dep-map .node.graph-dim,.dep-map .force-node.graph-dim{opacity:.10}
.dep-map .edge.graph-dim,.dep-map .force-edge.graph-dim{opacity:.035!important}
.dep-map .node.graph-context,.dep-map .force-node.graph-context{opacity:.48}
.dep-map .edge.graph-context,.dep-map .force-edge.graph-context{stroke:#7895b8!important;opacity:.34!important;stroke-width:1.45!important}
.dep-map .node.graph-focus,.dep-map .force-node.graph-focus{opacity:1}
.dep-map .edge.graph-focus,.dep-map .force-edge.graph-focus{stroke:var(--blue)!important;opacity:1!important;stroke-width:2.35!important}
.dep-map .node.graph-focus rect{stroke:var(--blue);stroke-width:2.15}
.dep-map .node.selected,.dep-map .force-node.selected{opacity:.82}
.dep-map .node.selected rect{stroke:#315f9f;stroke-width:2.55;filter:drop-shadow(0 2px 5px #395f991f)}

<!-- Modelo 2D didático. Viga uniforme, linear elástica e sem recalques. O peso próprio é uniforme.
     Reações de estruturas com vínculos excedentes usam EI constante. Não é verificação normativa.
     Fontes
     https://engineeringstatics.org/Chapter_08.html
     https://engineeringstatics.org/VM_diagrams.html
     https://engineeringstatics.org/VM_relations.html
     https://interactivetextbooks.citg.tudelft.nl/computational-modelling/structural_linear/euler_bernouilli.html
     Carga distribuída uniforme em qualquer subintervalo. Integração exata dos polinômios de Hermite.
      Reações, V e M consideram o carregamento original, sem trocar a distribuição por uma força no diagrama.
      Forças horizontais, rigidez variável, recalques e efeitos não lineares não estão incluídos.
      https://engineeringstatics.org/distributed-loads.html
      A verificação desta versão está em viga_validacao_distribuidas.html. -->

// Um nó representa uma grandeza ou um vínculo específico, nunca uma lista de cargas.
// Um nó por grandeza física. O sentido pertence ao sinal da própria força.
function makeGraph(s,r,section=probeX,side=probeSide) {
  const nodes=[];
  function add(id,name,value,display,deps,role='calculation',editor='',formula='') {

  const sx=p=>'support_'+p.id+'_x',st=p=>'support_'+p.id+'_type';

  add('g','Gravidade g',s.g,fmt(s.g)+' m/s²',[],'parameter','beam');
  for (const p of s.supports) {
    add(st(p),'Tipo de '+p.name,p.type,supportNames[p.type],[],'parameter','support:'+p.id,'Condições de deslocamento e rotação no apoio');
    add(sx(p),'Posição de '+p.name,p.x,fmt(p.x)+' m',['L',st(p)],p.edge?'calculation':'parameter','support:'+p.id,p.edge==='right'?'x'+p.name+' = L':p.edge==='left'?'x'+p.name+' = 0':'0 ≤ x'+p.name+' ≤ L. L limita a posição, mas não a escala.');
  }
  const fids=[],mids=[],jids=[],qids=[],qdetails=[];
  for (const p of s.loads) {
    const id='load_'+p.id,editor='load:'+p.id;
    add(lx(p),(p.kind==='udl'?'Início ':'Posição ')+p.name,p.x,fmt(p.x)+' m',['L'],p.edge?'calculation':'parameter',editor,p.edge==='right'?'x = L':p.edge==='left'?'x = 0':'Posição medida da esquerda. O comprimento limita o intervalo disponível.');
    if (p.kind==='moment') {
      const value=loadMoment(p);mids.push(lm(p));
      add(lm(p),'Momento '+p.name,value,momentText(value),[],'parameter',editor,'Momento aplicado com sinal. Anti-horário positivo.');
    } else if (p.kind==='udl') {
      const qid=id+'_q',end=id+'_end',length=id+'_ell',center=id+'_xc',Q=id+'_Q',J='j_'+p.id;
      add(end,'Fim '+p.name,p.end,fmt(p.end)+' m',['L',lx(p)],p.endEdge==='right'?'calculation':'parameter',editor,p.endEdge==='right'?'b = L':'a < b ≤ L. O início limita o fim do intervalo.');
      add(length,'Extensão '+p.name,p.end-p.x,fmt(p.end-p.x)+' m',[lx(p),end],'calculation',editor,'ℓ = b − a');
      add(center,'Centro '+p.name,(p.x+p.end)/2,fmt((p.x+p.end)/2)+' m',[lx(p),end],'calculation',editor,'xq = (a + b) / 2');
      add(qid,'Intensidade '+p.name,loadIntensity(p),distributedText(loadIntensity(p)),[],'parameter',editor,'Intensidade com sinal. Positiva para baixo.');
      const val=loadIntensity(p)*(p.end-p.x);
      add(Q,'Resultante '+p.name,val,forceText(val),[qid,length],'calculation',editor,'Q = q × (b − a). Resultante para o equilíbrio global, não para substituir o carregamento no diagrama.');
      add(J,'Momento de '+p.name,val*(p.x+p.end)/2,momentText(val*(p.x+p.end)/2),[Q,center],'calculation',editor,'J = Q × xq, em relação à extremidade esquerda');
      qids.push(Q);jids.push(J);qdetails.push(qid,lx(p),end);
    } else {

      if (p.kind==='mass') {add(id+'_mass','Massa '+p.name,p.value,fmt(p.value)+' kg',[],'parameter',editor);deps.push(id+'_mass','g');}

function reachable(roots,nodes) {
  const found=new Set(roots);let progress=true;
  while (progress) {
    progress=false;

  }
  return found;
}
function ancestors(ids,nodes) {
  const found=new Set(ids),todo=[...ids];
  while (todo.length) {
    const id=todo.pop(),n=nodes.find(n=>n.id===id);
    if (!n) continue;
    for (const d of n.deps) if (!found.has(d)) {found.add(d);todo.push(d);}
  }
  return found;
}

function edgeRelation(fromId,toId) {
  const from=graphNodes.find(n=>n.id===fromId),to=graphNodes.find(n=>n.id===toId);
  if (!from||!to) return relationCatalog.propaga;

function propagationLevels(rootId) {
  const depth=new Map([[rootId,0]]),queue=[rootId];
  while (queue.length) {
    const current=queue.shift(),d=depth.get(current);
    for (const child of graphNodes.filter(n=>n.deps.includes(current))) if (!depth.has(child.id)) {depth.set(child.id,d+1);queue.push(child.id);}
  }
  return [...depth.entries()].filter(([id])=>id!==rootId).map(([id,level])=>({node:graphNodes.find(n=>n.id===id),level})).filter(x=>x.node).sort((a,b)=>a.level-b.level||a.node.name.localeCompare(b.node.name,'pt-BR'));
}
function formulaLatex(n) {

  return raw
    .replaceAll('Σ','\sum ')
    .replaceAll('×','\,')
    .replaceAll('−','-')
    .replaceAll('²','^{2}')
    .replaceAll('³','^{3}')
    .replaceAll('≤','\le ')
    .replaceAll('≥','\ge ')
    .replaceAll('ℓ','\ell ')

function changeInfo(n) {
  const old=previousGraph.find(v=>v.id===n.id);
  if (!old) {
    if (sources.has(n.id)) return {arrow:'●',text:'Elemento adicionado ou ativado.',short:'●'};
    return null;
  }
  if (typeof old.value==='number'&&typeof n.value==='number'&&Number.isFinite(old.value)&&Number.isFinite(n.value)) {
    const delta=n.value-old.value;
    const tol=1e-8*Math.max(1,Math.abs(old.value),Math.abs(n.value));
    if (Math.abs(delta)<=tol) {
      if ([...old.deps].sort().join('|')!==[...n.deps].sort().join('|')) return {arrow:'↻',text:'As dependências mudaram, mas o valor atual permaneceu igual.',short:'↻'};
      return null;
    }
    const arrow=delta>0?'↑':'↓';
    const pct=Math.abs(old.value)>1e-12?Math.abs(delta/old.value*100):null;
    const pctText=pct!==null?' · '+fmt(pct,1)+'%':'';
    return {arrow,text:`${old.display} → ${n.display}${pctText}`,short:arrow};
  }
  if (differs(old.value,n.value)) return {arrow:'↔',text:`${old.display} → ${n.display}`,short:'↔'};
  if ([...old.deps].sort().join('|')!==[...n.deps].sort().join('|')) return {arrow:'↻',text:'As dependências deste elemento foram alteradas.',short:'↻'};
  return null;
}

function applyGraphFocusDOM() {
  const svg=byId('dep-map');
  if (!svg) return;

  const selectedFocus=graphSelected?graphDeepFocus(graphSelected):null;
  const hoverFocus=graphHover?(graphStyle==='live'?graphDeepFocus(graphHover):graphDirectFocus(graphHover)):null;
  const hasFocus=Boolean(selectedFocus||hoverFocus);
  const liveRoot=graphStyle==='live'?(graphHover||graphSelected):'';
  const liveUp=liveRoot?ancestors([liveRoot],graphNodes):null;
  const liveDown=liveRoot?reachable([liveRoot],graphNodes):null;
  if (liveUp) liveUp.delete(liveRoot);
  if (liveDown) liveDown.delete(liveRoot);

  svg.querySelectorAll('[data-node]').forEach(el=>{
    const id=el.dataset.node;
    const inHover=Boolean(hoverFocus&&hoverFocus.has(id));
    const inSelected=Boolean(selectedFocus&&selectedFocus.has(id));
    const selected=id===graphSelected;
    const hovered=id===graphHover;

    el.classList.toggle('graph-focus',inHover||(!hoverFocus&&inSelected));
    el.classList.toggle('graph-context',Boolean(hoverFocus&&inSelected&&!inHover));
    el.classList.toggle('graph-dim',Boolean(hasFocus&&!inHover&&!inSelected));
    el.classList.toggle('selected',selected);
    el.classList.toggle('hovered',hovered);
    el.classList.toggle('live-root',Boolean(liveRoot&&id===liveRoot));
    el.classList.toggle('live-upstream',Boolean(liveUp&&liveUp.has(id)));
    el.classList.toggle('live-downstream',Boolean(liveDown&&liveDown.has(id)));
  });

  svg.querySelectorAll('[data-from][data-to]').forEach(el=>{
    const from=el.dataset.from;
    const to=el.dataset.to;
    const inHover=Boolean(hoverFocus&&hoverFocus.has(from)&&hoverFocus.has(to));
    const inSelected=Boolean(selectedFocus&&selectedFocus.has(from)&&selectedFocus.has(to));
    const upEdge=Boolean(liveRoot&&liveUp&&liveUp.has(from)&&(liveUp.has(to)||to===liveRoot));
    const downEdge=Boolean(liveRoot&&liveDown&&(from===liveRoot||liveDown.has(from))&&liveDown.has(to));

    el.classList.toggle('graph-focus',inHover||(!hoverFocus&&inSelected));
    el.classList.toggle('graph-context',Boolean(hoverFocus&&inSelected&&!inHover));
    el.classList.toggle('graph-dim',Boolean(hasFocus&&!inHover&&!inSelected));
    el.classList.toggle('live-upstream',upEdge);
    el.classList.toggle('live-downstream',downEdge);
  });

  if (graphSelected) {
    const selected=svg.querySelector(`[data-node="${CSS.escape(graphSelected)}"]`);
    if (selected&&selected.parentNode) selected.parentNode.appendChild(selected);
  }

  if (graphHover&&graphHover!==graphSelected) {
    const hovered=svg.querySelector(`[data-node="${CSS.escape(graphHover)}"]`);
    if (hovered&&hovered.parentNode) hovered.parentNode.appendChild(hovered);
  }
}
