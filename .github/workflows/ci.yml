name: CI - Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, tests, audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: norte/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix norte ci --no-audit --no-fund

      - name: Scan tracked files for secrets
        run: node norte/scripts/scan-secrets.mjs

      - name: Audit dependencies
        run: npm --prefix norte run security:audit

      - name: Run quality gate
        run: npm --prefix norte run quality

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Test meeting engine and browser logic
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
